name: File 18 Final Hardening
on:
  push:
    branches:
      - feat/file-18-marketplace-plan-complete-2.0.0
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/file-18-marketplace-plan-complete-2.0.0
          fetch-depth: 0
      - name: Apply fresh-review hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('18-marketplace')

          def repl(path, old, new, n=1):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'expected block missing: {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,n))

          # QA test literal: inspect PHP source text without variable interpolation.
          repl(root/'tests/test-four-plan-invariants.php',
               'str_contains($auth, "!$assertions[\'verified\']")',
               'str_contains($auth, "!\\$assertions[\'verified\']")')

          # Fresh review: dispute reviewers must also pass current File 00 verification/risk/suspension checks.
          p=root/'includes/class-mkt-commerce.php'; s=p.read_text()
          old="""        $participant = MKT_Auth::deal_participant($deal, $actor_id);\n        $reviewer = current_user_can('mkt_review_disputes');\n        if (!$participant && !$reviewer) {\n"""
          new="""        $participant = MKT_Auth::deal_participant($deal, $actor_id);\n        $reviewer = false;\n        if (current_user_can('mkt_review_disputes')) {\n            $reviewer_auth = MKT_Auth::can('mkt_review_disputes', ['action' => 'review_deal', 'deal_public_id' => $public_id]);\n            $reviewer = !is_wp_error($reviewer_auth);\n        }\n        if (!$participant && !$reviewer) {\n"""
          if old not in s: raise SystemExit('transition-deal reviewer block missing')
          s=s.replace(old,new,1)
          old="""        if (!$deal || (!MKT_Auth::deal_participant($deal, $user_id) && !current_user_can('mkt_review_disputes'))) {\n            return new WP_Error('mkt_deal_not_found', __('Deal not found.', 'marketplace'), ['status' => 404]);\n        }\n        return self::deal_dto($deal);\n"""
          new="""        if (!$deal) {\n            return new WP_Error('mkt_deal_not_found', __('Deal not found.', 'marketplace'), ['status' => 404]);\n        }\n        if (!MKT_Auth::deal_participant($deal, $user_id)) {\n            $reviewer_auth = MKT_Auth::can('mkt_review_disputes', ['action' => 'read_deal_for_dispute', 'deal_public_id' => $public_id]);\n            if (is_wp_error($reviewer_auth)) {\n                return new WP_Error('mkt_deal_not_found', __('Deal not found.', 'marketplace'), ['status' => 404]);\n            }\n        }\n        return self::deal_dto($deal);\n"""
          if old not in s: raise SystemExit('get-deal reviewer block missing')
          p.write_text(s.replace(old,new,1))

          # Admin business/policy writes require current high-trust authorization. Break-glass repair stays native-admin.
          p=root/'includes/class-mkt-admin.php'; s=p.read_text()
          s=s.replace("        if (!current_user_can('manage_options')) return $current;\n", "        $auth = MKT_Auth::can('manage_options', ['action' => 'update_marketplace_settings']);\n        if (is_wp_error($auth)) return $current;\n", 1)
          s=s.replace("            'promotions_enabled' => !empty($input['promotions_enabled']) ? 1 : 0,\n", "            'promotions_enabled' => 0, // paid/donor ranking influence is constitutionally disabled\n", 1)
          s=s.replace("        if (!current_user_can('mkt_manage_policies')) wp_die(esc_html__('Access denied.', 'marketplace'));\n        check_admin_referer('mkt_policy_save');\n", "        $auth = MKT_Auth::can('mkt_manage_policies', ['action' => 'save_marketplace_policy']);\n        if (is_wp_error($auth)) wp_die(esc_html__('Access denied.', 'marketplace'));\n        check_admin_referer('mkt_policy_save');\n", 1)
          s=s.replace("        <?php foreach (['safe_mode','selling_enabled','offers_enabled','deal_transitions_enabled','promotions_enabled'] as $key): ?>", "        <?php foreach (['safe_mode','selling_enabled','offers_enabled','deal_transitions_enabled'] as $key): ?>", 1)
          p.write_text(s)

          # Database upgrade lock: MySQL advisory lock is atomic and connection-owned; runtime version updates even when schema is unchanged.
          p=root/'includes/class-mkt-db.php'; s=p.read_text()
          old="""    public static function maybe_upgrade(): void {\n        if ((string) get_option('mkt_schema_version', '') === MKT_SCHEMA_VERSION) {\n            return;\n        }\n        $lock = 'mkt_upgrade_lock';\n        if (get_transient($lock)) {\n            return;\n        }\n        set_transient($lock, wp_generate_uuid4(), 5 * MINUTE_IN_SECONDS);\n        try {\n            self::install_schema();\n            self::seed_defaults();\n            self::migrate_legacy_foundation();\n            update_option('mkt_plugin_version', MKT_VERSION, false);\n        } finally {\n            delete_transient($lock);\n        }\n    }\n\n"""
          new="""    public static function maybe_upgrade(): void {\n        $schema_current = (string) get_option('mkt_schema_version', '') === MKT_SCHEMA_VERSION;\n        $runtime_current = (string) get_option('mkt_plugin_version', '') === MKT_VERSION;\n        if ($schema_current && $runtime_current) {\n            return;\n        }\n        if (!self::acquire_upgrade_lock()) {\n            return;\n        }\n        try {\n            if (!$schema_current) {\n                self::install_schema();\n                self::seed_defaults();\n                self::migrate_legacy_foundation();\n            }\n            update_option('mkt_plugin_version', MKT_VERSION, false);\n        } finally {\n            self::release_upgrade_lock();\n        }\n    }\n\n    private static function acquire_upgrade_lock(): bool {\n        global $wpdb;\n        $name = substr($wpdb->prefix . 'mkt_file18_upgrade', 0, 64);\n        return (int) $wpdb->get_var($wpdb->prepare('SELECT GET_LOCK(%s,0)', $name)) === 1;\n    }\n\n    private static function release_upgrade_lock(): void {\n        global $wpdb;\n        $name = substr($wpdb->prefix . 'mkt_file18_upgrade', 0, 64);\n        $wpdb->get_var($wpdb->prepare('SELECT RELEASE_LOCK(%s)', $name));\n    }\n\n"""
          if old not in s: raise SystemExit('maybe_upgrade block missing')
          s=s.replace(old,new,1)

          # Bound legacy seller migration with deterministic keyset batches.
          old="""        if ($has_sellers) {\n            $rows = $wpdb->get_results(\"SELECT * FROM {$legacy_sellers} ORDER BY id ASC\", ARRAY_A);\n            foreach ($rows as $row) {\n"""
          new="""        if ($has_sellers) {\n            $last_seller_id = 0;\n            do {\n                $rows = $wpdb->get_results($wpdb->prepare(\"SELECT * FROM {$legacy_sellers} WHERE id>%d ORDER BY id ASC LIMIT 200\", $last_seller_id), ARRAY_A);\n                foreach ($rows as $row) {\n                    $last_seller_id = max($last_seller_id, (int) $row['id']);\n"""
          if old not in s: raise SystemExit('seller migration start missing')
          s=s.replace(old,new,1)
          old="""                $report['sellers']++;\n            }\n        }\n        if ($has_products && $has_sellers) {\n            $rows = $wpdb->get_results(\"SELECT p.*,s.user_id AS legacy_user_id FROM {$legacy_products} p LEFT JOIN {$legacy_sellers} s ON s.id=p.seller_id ORDER BY p.id ASC\", ARRAY_A);\n            foreach ($rows as $row) {\n"""
          new="""                    $report['sellers']++;\n                }\n            } while (count($rows) === 200);\n        }\n        if ($has_products && $has_sellers) {\n            $last_product_id = 0;\n            do {\n                $rows = $wpdb->get_results($wpdb->prepare(\"SELECT p.*,s.user_id AS legacy_user_id FROM {$legacy_products} p LEFT JOIN {$legacy_sellers} s ON s.id=p.seller_id WHERE p.id>%d ORDER BY p.id ASC LIMIT 200\", $last_product_id), ARRAY_A);\n                foreach ($rows as $row) {\n                    $last_product_id = max($last_product_id, (int) $row['id']);\n"""
          if old not in s: raise SystemExit('seller/product migration boundary missing')
          s=s.replace(old,new,1)
          old="""                $report['listings']++;\n            }\n        } elseif ($has_products) {\n"""
          new="""                    $report['listings']++;\n                }\n            } while (count($rows) === 200);\n        } elseif ($has_products) {\n"""
          if old not in s: raise SystemExit('product migration end missing')
          s=s.replace(old,new,1)

          # Bound communication handoff IDs as well.
          old="""            $ids = $wpdb->get_col(\"SELECT id FROM {$table} ORDER BY id ASC\");\n            foreach ($ids as $legacy_id) {\n                $payload_hash = hash('sha256', $type . ':' . (int) $legacy_id . ':' . MKT_SCHEMA_VERSION);\n                $wpdb->query($wpdb->prepare(\n                    'INSERT IGNORE INTO ' . self::table('migration_handoffs') . ' (legacy_type,legacy_id,target_owner,target_reference,payload_hash,status,attempts,last_error,created_at,updated_at) VALUES (%s,%d,%s,%s,%s,%s,0,%s,%s,%s)',\n                    $type, (int) $legacy_id, 'file-17-communication', '', $payload_hash, 'pending', '', self::now(), self::now()\n                ));\n                $report['communication_handoffs']++;\n            }\n"""
          new="""            $last_handoff_id = 0;\n            do {\n                $ids = $wpdb->get_col($wpdb->prepare(\"SELECT id FROM {$table} WHERE id>%d ORDER BY id ASC LIMIT 500\", $last_handoff_id));\n                foreach ($ids as $legacy_id) {\n                    $last_handoff_id = max($last_handoff_id, (int) $legacy_id);\n                    $payload_hash = hash('sha256', $type . ':' . (int) $legacy_id . ':' . MKT_SCHEMA_VERSION);\n                    $wpdb->query($wpdb->prepare(\n                        'INSERT IGNORE INTO ' . self::table('migration_handoffs') . ' (legacy_type,legacy_id,target_owner,target_reference,payload_hash,status,attempts,last_error,created_at,updated_at) VALUES (%s,%d,%s,%s,%s,%s,0,%s,%s,%s)',\n                        $type, (int) $legacy_id, 'file-17-communication', '', $payload_hash, 'pending', '', self::now(), self::now()\n                    ));\n                    $report['communication_handoffs']++;\n                }\n            } while (count($ids) === 500);\n"""
          if old not in s: raise SystemExit('handoff migration block missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Update fresh-review evidence: Round 3 did find and fix additional defects.
          p=root/'docs/FOUR-ROUND-GOVERNING-PLAN-AUDIT.md'; s=p.read_text()
          old='''## Round 3 — integration, privacy, discovery, degraded behavior\n\nFresh review after fixes confirmed canonical owners remain File 00 identity, File 17 communication, File 19 notifications, File 20 shell, File 24 assurance, File 25 visual and File 26 search. Runtime status now exposes the current single-free-tier/non-privilege/no-paid-ranking constitution. No new unresolved code defect was found in this round.\n'''
          new='''## Round 3 — integration, migration, authorization and degraded behavior\n\nFresh review after the first two corrections found further defects and corrected them: dispute-reviewer deal access relied on a WordPress capability without revalidating current File 00 verification/risk/suspension state; the schema/runtime upgrader used a non-atomic transient lock and did not promote the runtime option when schema version was unchanged; legacy seller/product/communication migrations loaded unbounded record sets; the dormant promotions setting remained writable despite the no-paid/no-donor-influence constitution; and policy/settings writes needed current high-trust authorization. These paths are now fail-closed or break-glass-scoped as appropriate, migration is keyset-batched, and the runtime/status contracts expose the current business constitution.\n'''
          if old not in s: raise SystemExit('audit round3 text missing')
          p.write_text(s.replace(old,new,1))

          # Expand four-plan test coverage for Round 3 corrections.
          p=root/'tests/test-four-plan-invariants.php'; s=p.read_text()
          insert="""assert_true(str_contains($auth, \"!\\$assertions['verified']\"), 'Protected Marketplace actions require verified identity.');\n"""
          extra="""assert_true(str_contains($auth, \"!\\$assertions['verified']\"), 'Protected Marketplace actions require verified identity.');\n$commerce = file_get_contents($root . '/includes/class-mkt-commerce.php');\n$db = file_get_contents($root . '/includes/class-mkt-db.php');\n$admin = file_get_contents($root . '/includes/class-mkt-admin.php');\nassert_true(str_contains($commerce, \"MKT_Auth::can('mkt_review_disputes'\"), 'Dispute-reviewer deal access revalidates current identity state.');\nassert_true(str_contains($db, 'SELECT GET_LOCK') && str_contains($db, 'SELECT RELEASE_LOCK'), 'Upgrade concurrency uses an atomic connection-owned database lock.');\nassert_true(str_contains($db, 'LIMIT 200') && str_contains($db, 'LIMIT 500'), 'Legacy migration reads are bounded by keyset batches.');\nassert_true(str_contains($admin, \"'promotions_enabled' => 0\") && !str_contains($admin, \"'deal_transitions_enabled','promotions_enabled'\"), 'Paid/donor promotion control is not user-enableable.');\nassert_true(str_contains($admin, \"MKT_Auth::can('mkt_manage_policies'\"), 'Marketplace policy writes revalidate high-trust authorization.');\n"""
          if insert not in s: raise SystemExit('test insert anchor missing')
          p.write_text(s.replace(insert,extra,1))

          # Changelog Round 3 hardening notes.
          p=root/'CHANGELOG.md'; s=p.read_text()
          anchor='- Added four-plan invariant tests and four-round audit record.\n'
          addition='- Revalidated dispute-reviewer deal access against current File 00 assertions; made upgrade locking atomic; bounded legacy migration batches; disabled writable promotions; revalidated policy/settings writes.\n'
          if anchor in s and addition not in s: s=s.replace(anchor,anchor+addition,1)
          p.write_text(s)
          PY
          (
            cd 18-marketplace
            rm -f MANIFEST.sha256
            find . -type f ! -path './.git/*' ! -path './tests/*' ! -path './tools/*' ! -name 'MANIFEST.sha256' -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          )
          php -l 18-marketplace/includes/class-mkt-db.php
          php -l 18-marketplace/includes/class-mkt-commerce.php
          php -l 18-marketplace/includes/class-mkt-admin.php
          php -l 18-marketplace/tests/test-four-plan-invariants.php
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 18-marketplace
          git commit -m 'fix(file18): close fresh-review authorization and migration gaps'
          git push origin HEAD:feat/file-18-marketplace-plan-complete-2.0.0
