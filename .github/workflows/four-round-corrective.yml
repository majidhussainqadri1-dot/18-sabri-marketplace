name: File 18 Four-Round Corrective Pass
on:
  push:
    branches:
      - feat/file-18-marketplace-plan-complete-2.0.0
permissions:
  contents: write
jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/file-18-marketplace-plan-complete-2.0.0
          fetch-depth: 0
      - name: Apply governing-plan corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('18-marketplace')

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old[:100]!r}')
              s2 = s.replace(old, new, count)
              p.write_text(s2)

          # Runtime/contract corrective release; schema unchanged.
          replace(root/'marketplace.php', ' * Version: 2.0.0', ' * Version: 2.0.1')
          replace(root/'marketplace.php', "define('MKT_VERSION', '2.0.0');", "define('MKT_VERSION', '2.0.1');")
          replace(root/'marketplace.php', "define('MKT_CONTRACT_VERSION', '1.0.0');", "define('MKT_CONTRACT_VERSION', '1.1.0');")
          replace(root/'readme.txt', 'Stable tag: 2.0.0', 'Stable tag: 2.0.1')

          # Round 1: High-trust protected actions must be both approved and verified;
          # high/critical/blocked risk states fail closed on every protected action.
          p = root/'includes/class-mkt-auth.php'
          s = p.read_text()
          s = s.replace(
              "        if (!$assertions['approved'] || $assertions['suspended']) {\n            return new WP_Error('mkt_account_not_eligible', __('Your account is not currently eligible for this action.', 'marketplace'), ['status' => 403]);\n        }\n",
              "        if (!$assertions['approved'] || !$assertions['verified'] || $assertions['suspended']) {\n            return new WP_Error('mkt_account_not_eligible', __('An approved and verified account is required for this action.', 'marketplace'), ['status' => 403]);\n        }\n        if (in_array((string) $assertions['risk_state'], ['blocked','high','critical'], true)) {\n            return new WP_Error('mkt_account_risk_hold', __('This action is unavailable while the account is under a marketplace risk hold.', 'marketplace'), ['status' => 403]);\n        }\n"
          )
          s = s.replace(
              "        if (!$assertions['approved']) {\n            $reasons[] = 'account_unapproved';\n        }\n",
              "        if (!$assertions['approved']) {\n            $reasons[] = 'account_unapproved';\n        }\n        if (!$assertions['verified']) {\n            $reasons[] = 'account_unverified';\n        }\n"
          )
          p.write_text(s)

          # Round 1: default discovery must not privilege a labeled listing. Labels remain
          # visible, but default ordering is neutral chronology after eligibility filters.
          replace(root/'includes/class-mkt-listings.php',
                  "$sql .= ' ORDER BY (l.featured_label<>\\'\\') DESC,l.published_at DESC,l.id DESC LIMIT %d';",
                  "$sql .= ' ORDER BY l.published_at DESC,l.id DESC LIMIT %d';")

          # Round 1: central business-law invariants are explicit machine-readable contracts.
          p = root/'includes/class-mkt-contracts.php'
          s = p.read_text()
          s = s.replace(
              "            'commission_percent' => self::zero_commission(),\n",
              "            'commission_percent' => self::zero_commission(),\n            'access_tier' => 'single_free',\n            'donation_advantage' => false,\n            'paid_ranking' => false,\n"
          )
          p.write_text(s)

          # Round 1: File 25 design-token ownership, with resilient green fallbacks.
          p = root/'assets/css/marketplace.css'
          s = p.read_text()
          s = s.replace(':root{--mkt-green:#147a43;--mkt-green-dark:#0d5b31;--mkt-green-soft:#eaf7ef;', ':root{--mkt-green:var(--sabri-color-primary,#147a43);--mkt-green-dark:var(--sabri-color-primary-strong,#0d5b31);--mkt-green-soft:var(--sabri-color-primary-soft,#eaf7ef);', 1)
          p.write_text(s)

          # Round 1: File 20 owns shared Back/Home when present; local controls are a no-shell fallback.
          p = root/'templates/_header.php'
          s = p.read_text()
          old = '''    <nav class="mkt-context-nav" aria-label="<?php esc_attr_e('Marketplace navigation', 'marketplace'); ?>">\n      <a class="mkt-icon-link" href="<?php echo esc_url(wp_get_referer() && wp_validate_redirect(wp_get_referer()) ? wp_get_referer() : home_url('/marketplace/')); ?>" aria-label="<?php esc_attr_e('Back', 'marketplace'); ?>">← <span><?php esc_html_e('Back', 'marketplace'); ?></span></a>\n      <a class="mkt-icon-link" href="<?php echo esc_url(home_url('/')); ?>" aria-label="<?php esc_attr_e('Home', 'marketplace'); ?>">⌂ <span><?php esc_html_e('Home', 'marketplace'); ?></span></a>\n      <a class="mkt-icon-link" href="<?php echo esc_url(home_url('/marketplace/')); ?>">▦ <span><?php esc_html_e('Marketplace', 'marketplace'); ?></span></a>\n'''
          new = '''    <nav class="mkt-context-nav" aria-label="<?php esc_attr_e('Marketplace navigation', 'marketplace'); ?>">\n      <?php if (!MKT_Integrations::shell_owns_context_navigation()): ?>\n        <a class="mkt-icon-link" href="<?php echo esc_url(MKT_Routes::safe_back_url()); ?>" aria-label="<?php esc_attr_e('Back', 'marketplace'); ?>">← <span><?php esc_html_e('Back', 'marketplace'); ?></span></a>\n        <a class="mkt-icon-link" href="<?php echo esc_url(home_url('/')); ?>" aria-label="<?php esc_attr_e('Home', 'marketplace'); ?>">⌂ <span><?php esc_html_e('Home', 'marketplace'); ?></span></a>\n      <?php endif; ?>\n      <a class="mkt-icon-link" href="<?php echo esc_url(home_url('/marketplace/')); ?>">▦ <span><?php esc_html_e('Marketplace', 'marketplace'); ?></span></a>\n'''
          if old not in s:
              raise SystemExit('header context-nav block not found')
          p.write_text(s.replace(old, new, 1))

          # Round 1: same-origin safe Back fallback and explicit shell navigation ownership probe.
          p = root/'includes/class-mkt-routes.php'
          s = p.read_text()
          marker = "    public static function register_assets(): void {\n"
          addition = '''    public static function safe_back_url(): string {\n        $fallback = home_url('/marketplace/');\n        $referer = wp_get_referer();\n        if (!$referer) {\n            return $fallback;\n        }\n        $validated = wp_validate_redirect($referer, '');\n        if ($validated === '') {\n            return $fallback;\n        }\n        $home = wp_parse_url(home_url('/'));\n        $target = wp_parse_url($validated);\n        if (!is_array($home) || !is_array($target) || empty($target['host']) || strcasecmp((string) ($home['host'] ?? ''), (string) $target['host']) !== 0) {\n            return $fallback;\n        }\n        return $validated;\n    }\n\n'''
          if marker not in s: raise SystemExit('route marker missing')
          p.write_text(s.replace(marker, addition + marker, 1))

          p = root/'includes/class-mkt-integrations.php'
          s = p.read_text()
          marker = "    public static function shell_navigation(array $destinations): array {\n"
          addition = '''    public static function shell_owns_context_navigation(): bool {\n        $present = defined('SABRI_UNIFIED_SHELL_VERSION')\n            || class_exists('Sabri\\\\UnifiedShell\\\\Layout')\n            || function_exists('sabri_unified_shell_register_destination');\n        return (bool) apply_filters('mkt_shell_owns_context_navigation', $present, 'marketplace');\n    }\n\n'''
          if marker not in s: raise SystemExit('integrations marker missing')
          p.write_text(s.replace(marker, addition + marker, 1))

          # Round 2: idempotency failed/stale claims must be atomically reacquired.
          p = root/'includes/class-mkt-idempotency.php'
          s = p.read_text()
          old = '''            if ((string) $row['status'] === 'processing') {\n                return new WP_Error('mkt_request_in_progress', __('An identical request is already in progress.', 'marketplace'), ['status' => 409, 'retry_after' => 2]);\n            }\n            $wpdb->update($table, ['status' => 'processing', 'response_code' => 0, 'response_json' => null, 'created_at' => MKT_DB::now(), 'expires_at' => gmdate('Y-m-d H:i:s', time() + DAY_IN_SECONDS)], ['id' => (int) $row['id']]);\n'''
          new = '''            $claimable = (string) $row['status'] === 'failed'\n                || ((string) $row['status'] === 'processing' && strtotime((string) $row['expires_at']) <= time());\n            if (!$claimable) {\n                return new WP_Error('mkt_request_in_progress', __('An identical request is already in progress.', 'marketplace'), ['status' => 409, 'retry_after' => 2]);\n            }\n            $previous_status = (string) $row['status'];\n            $claimed = $wpdb->query($wpdb->prepare(\n                "UPDATE {$table} SET status='processing',response_code=0,response_json=NULL,created_at=%s,expires_at=%s WHERE id=%d AND status=%s",\n                MKT_DB::now(), gmdate('Y-m-d H:i:s', time() + DAY_IN_SECONDS), (int) $row['id'], $previous_status\n            ));\n            if ($claimed !== 1) {\n                return new WP_Error('mkt_request_in_progress', __('An identical request is already being retried.', 'marketplace'), ['status' => 409, 'retry_after' => 2]);\n            }\n'''
          if old not in s: raise SystemExit('idempotency retry block missing')
          p.write_text(s.replace(old, new, 1))

          # Round 2: external inbox detects event-ID payload conflicts and permits bounded failed retry.
          p = root/'includes/class-mkt-events.php'
          s = p.read_text()
          old = '''        if (!$inserted) {\n            return true;\n        }\n        try {\n'''
          new = '''        if (!$inserted) {\n            $existing = $wpdb->get_row($wpdb->prepare(\n                'SELECT * FROM ' . MKT_DB::table('inbox') . ' WHERE source=%s AND event_id=%s',\n                sanitize_key($source), $event_id\n            ), ARRAY_A);\n            if (!$existing) {\n                return new WP_Error('mkt_event_inbox_unavailable', __('The event inbox could not be read safely.', 'marketplace'));\n            }\n            if (!hash_equals((string) $existing['payload_hash'], $payload_hash)) {\n                return new WP_Error('mkt_event_payload_conflict', __('The event ID was reused with a different payload.', 'marketplace'));\n            }\n            if ((string) $existing['status'] === 'processed') {\n                return true;\n            }\n            if ((string) $existing['status'] !== 'failed') {\n                return new WP_Error('mkt_event_in_progress', __('The event is already being processed.', 'marketplace'));\n            }\n            $reclaimed = $wpdb->query($wpdb->prepare(\n                "UPDATE " . MKT_DB::table('inbox') . " SET status='received',received_at=%s WHERE id=%d AND status='failed'",\n                MKT_DB::now(), (int) $existing['id']\n            ));\n            if ($reclaimed !== 1) {\n                return new WP_Error('mkt_event_in_progress', __('The failed event is already being retried.', 'marketplace'));\n            }\n        }\n        try {\n'''
          if old not in s: raise SystemExit('event duplicate block missing')
          p.write_text(s.replace(old, new, 1))

          # Round 3: status/contract truth advertises current business constitution.
          p = root/'includes/class-mkt-rest.php'
          s = p.read_text()
          s = s.replace("            'commission_percent' => 0,\n            'public_browse' => true,\n", "            'commission_percent' => 0,\n            'access_tier' => 'single_free',\n            'donation_advantage' => false,\n            'paid_ranking' => false,\n            'public_browse' => true,\n", 1)
          p.write_text(s)

          # Round 4: version/build identity and direct-source QA.
          p = root/'tools/build-release.sh'
          s = p.read_text().replace('VERSION="2.0.0"', 'VERSION="2.0.1"').replace('PACKAGE="18-marketplace-${VERSION}-RC1.zip"', 'PACKAGE="18-marketplace-${VERSION}-RC2.zip"')
          p.write_text(s)

          p = root/'tests/qa-static.sh'
          s = p.read_text()
          s = s.replace("echo '[10/10] Release identity'", "echo '[10/11] Release identity'")
          s = s.replace("grep -q 'Version: 2.0.0' \"$ROOT/marketplace.php\"", "grep -q 'Version: 2.0.1' \"$ROOT/marketplace.php\"")
          s = s.replace("grep -q 'Stable tag: 2.0.0' \"$ROOT/readme.txt\"", "grep -q 'Stable tag: 2.0.1' \"$ROOT/readme.txt\"")
          s = s.replace("echo 'ALL STATIC AND CONTRACT TESTS PASSED'", "echo '[11/11] Four-plan governing invariants'\nphp \"$ROOT/tests/test-four-plan-invariants.php\"\necho 'ALL STATIC AND CONTRACT TESTS PASSED'")
          p.write_text(s)

          (root/'tests/test-four-plan-invariants.php').write_text(r'''<?php
          require __DIR__ . '/bootstrap.php';
          $root = dirname(__DIR__);
          $auth = file_get_contents($root . '/includes/class-mkt-auth.php');
          $contracts = file_get_contents($root . '/includes/class-mkt-contracts.php');
          $events = file_get_contents($root . '/includes/class-mkt-events.php');
          $idem = file_get_contents($root . '/includes/class-mkt-idempotency.php');
          $listings = file_get_contents($root . '/includes/class-mkt-listings.php');
          $rest = file_get_contents($root . '/includes/class-mkt-rest.php');
          $css = file_get_contents($root . '/assets/css/marketplace.css');
          assert_true(str_contains($auth, "!$assertions['verified']"), 'Protected Marketplace actions require verified identity.');
          assert_true(str_contains($auth, "['blocked','high','critical']"), 'Protected actions fail closed on high-risk states.');
          assert_true(str_contains($contracts, "'access_tier' => 'single_free'") && str_contains($contracts, "'donation_advantage' => false") && str_contains($contracts, "'paid_ranking' => false"), 'Single-free-tier and non-privilege business laws are machine-readable.');
          assert_true(!str_contains($listings, "ORDER BY (l.featured_label<>''") && str_contains($listings, 'ORDER BY l.published_at DESC,l.id DESC'), 'Default discovery ranking cannot privilege a featured/donor/paid label.');
          assert_true(str_contains($idem, 'mkt_request_in_progress') && str_contains($idem, "AND status=%s"), 'Retry claims are conditional and concurrency-safe.');
          assert_true(str_contains($events, 'mkt_event_payload_conflict') && str_contains($events, "status='failed'"), 'External inbox rejects payload conflicts and can reclaim failed events.');
          assert_true(str_contains($rest, "'access_tier' => 'single_free'") && str_contains($rest, "'paid_ranking' => false"), 'Public status exposes current constitutional business state.');
          assert_true(str_contains($css, 'var(--sabri-color-primary,#147a43)'), 'Marketplace consumes File 25 primary design token with a green fallback.');
          assert_true(!is_dir(dirname($root) . '/bundles') && !file_exists(dirname($root) . '/reconstruct-source.sh'), 'Canonical source is reviewable directly; no base64 reconstruction is required.');
          fwrite(STDOUT, "Four-plan invariant suite complete.\n");
          ''')

          # Documentation truth for the four explicit review rounds.
          (root/'docs/FOUR-ROUND-GOVERNING-PLAN-AUDIT.md').write_text('''# File 18 — Four-Round Governing-Plan Audit\n\nCorrective runtime: **2.0.1**; schema remains **2.0.0**; contract **1.1.0**.\n\n## Governing sources\n\n1. Definitive Integrated Master Plan v3.0.\n2. Consolidated All-Chats Recovered Directives v2.2.\n3. Continuous Value / Global Top-20 Superset Master Plan v1.0.\n4. File 18 Marketplace Complete Master Plan v1.0.\n\n## Round 1 — constitution, ownership, business law, UX\n\nDefects found and corrected: protected actions accepted approved-but-unverified accounts; high-risk state was not enforced in the general capability gate; default discovery privileged `featured_label`; current single-free-tier/no-donor-advantage/no-paid-ranking law was not explicit in runtime contracts; component colors did not consume File 25 primary tokens; local Back/Home controls could duplicate File 20 ownership.\n\n## Round 2 — authorization, replay, concurrency, event integrity\n\nDefects found and corrected: failed idempotent operations could be reclaimed non-atomically; expired `processing` reservations had no safe takeover; external inbox treated every duplicate as success, so failed events could be lost permanently and reused event IDs with altered payloads were not rejected.\n\n## Round 3 — integration, privacy, discovery, degraded behavior\n\nFresh review after fixes confirmed canonical owners remain File 00 identity, File 17 communication, File 19 notifications, File 20 shell, File 24 assurance, File 25 visual and File 26 search. Runtime status now exposes the current single-free-tier/non-privilege/no-paid-ranking constitution. No new unresolved code defect was found in this round.\n\n## Round 4 — supply chain, source review, packaging, release truth\n\nDefect found and corrected: the PR depended on an encoded base64 source bundle plus reconstruction script, which is not an acceptable substitute for directly reviewable canonical source. The ordinary source tree is now canonical; reconstruction artifacts are removed; QA and release builds operate on the direct source tree. Runtime advanced to 2.0.1/RC2.\n\n## Status boundary\n\nThis audit establishes code/package/automated-QA candidate completion only. Hostinger staging, real companion integrations, browser/device/accessibility evidence, backup/restore/rollback rehearsal, Founder acceptance, live deployment and operational monitoring remain separate gates.\n''')

          # Changelog/status truth.
          p = root/'CHANGELOG.md'
          s = p.read_text()
          entry = '''# Changelog\n\n## 2.0.1 — Four-plan corrective candidate\n- Enforced approved + verified high-trust identity for protected Marketplace actions and fail-closed high-risk states.\n- Removed default featured-label ranking privilege; kept labels presentation-only.\n- Declared single-free-tier, donation-non-privilege and no-paid-ranking invariants in contracts/status.\n- Made idempotency retry claims atomic and recoverable after stale processing expiry.\n- Made external event inbox detect payload conflicts and safely retry failed events.\n- Consumed File 25 primary visual token with green fallback and avoided Back/Home duplication when File 20 owns context navigation.\n- Materialized direct canonical source and removed base64 reconstruction artifacts.\n- Added four-plan invariant tests and four-round audit record.\n\n'''
          if s.startswith('# Changelog\n'):
              s = entry + s[len('# Changelog\n\n'):]
          else:
              s = entry + s
          p.write_text(s)

          p = root/'STATUS.md'
          p.write_text('''# File 18 Status\n\n- Runtime candidate: **2.0.1**\n- Schema: **2.0.0**\n- Contract: **1.1.0**\n- Specified: complete against the four governing plans used in the four-round audit.\n- Coded: corrective candidate complete; direct source reviewable.\n- Packaged: deterministic RC2 build required from final exact head.\n- Automated QA: required on PHP 8.1 and 8.3 at final exact head.\n- Staging-Accepted: pending Hostinger acceptance.\n- Live-Deployed: pending Founder approval after staging.\n- Operational: pending production monitoring/support/backup evidence.\n''')

          # Remove opaque reconstruction artifacts: direct source is now canonical.
          for target in ['bundles', 'patches']:
              q = Path(target)
              if q.exists():
                  import shutil; shutil.rmtree(q)
          for target in ['reconstruct-source.sh', 'SOURCE-BUNDLE.md']:
              q = Path(target)
              if q.exists(): q.unlink()

          # Regenerate source manifest exactly as the release builder does.
          manifest = root/'MANIFEST.sha256'
          if manifest.exists(): manifest.unlink()
          PY
          (
            cd 18-marketplace
            find . -type f ! -path './.git/*' ! -path './tests/*' ! -path './tools/*' ! -name 'MANIFEST.sha256' -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          )
      - name: Commit corrected candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo 'No corrective source changes detected.'
            exit 0
          fi
          git commit -m 'fix(file18): four-plan corrective audit and direct-source hardening'
          git push origin HEAD:feat/file-18-marketplace-plan-complete-2.0.0
