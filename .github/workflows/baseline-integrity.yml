name: Baseline Integrity

on:
  push:
    branches:
      - main
      - baseline/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify baseline source
        run: |
          if compgen -G "artifacts/parts/*" > /dev/null; then
            echo "Bootstrap package parts are present; exact-source import is still running."
            exit 0
          fi
          sha256sum --check CHECKSUMS.sha256
          find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l
          node --check assets/js/marketplace.js
