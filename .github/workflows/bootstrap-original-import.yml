name: Bootstrap Exact File 18 Baseline

on:
  push:
    branches:
      - baseline/file-18-original-import
    paths:
      - "artifacts/parts/**"
      - ".github/workflows/bootstrap-original-import.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out baseline branch
        uses: actions/checkout@v4
        with:
          ref: baseline/file-18-original-import

      - name: Rebuild and verify original package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original-package
          cat artifacts/parts/part-* | base64 --decode > 'original-package/18 sabri-marketplace-1.1.0.zip'
          printf '%s  %s\n' \
            '7140ec5a0a41d880f2a8609d5c07f0b84b64b4b5674d9e167458eb76519f1b30' \
            'original-package/18 sabri-marketplace-1.1.0.zip' | sha256sum -c -

      - name: Extract exact plugin source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .baseline-extract
          mkdir .baseline-extract
          unzip -q 'original-package/18 sabri-marketplace-1.1.0.zip' -d .baseline-extract
          test "$(find .baseline-extract/sabri-marketplace -type f | wc -l | tr -d ' ')" = '17'
          cp -a .baseline-extract/sabri-marketplace/. .
          rm -rf .baseline-extract artifacts/parts .github/workflows/bootstrap-original-import.yml

      - name: Commit exact archive and source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import exact File 18 marketplace baseline 1.1.0'
          git push origin HEAD:baseline/file-18-original-import
