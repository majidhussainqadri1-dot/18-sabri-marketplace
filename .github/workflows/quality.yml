name: File 18 Marketplace Quality
on:
  pull_request:
  push:
    branches:
      - main
      - feat/file-18-marketplace-plan-complete-2.0.0
permissions:
  contents: read
jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Direct-source supply-chain gate
        shell: bash
        run: |
          set -euo pipefail
          test -s 18-marketplace/marketplace.php
          test -d 18-marketplace/includes
          test -d 18-marketplace/tests
          test ! -e reconstruct-source.sh
          test ! -d bundles
          test ! -d patches
          if find . -type f -name '*.b64*' -print -quit | grep -q .; then
            echo 'Encoded source bundle detected; canonical source must be directly reviewable.' >&2
            exit 1
          fi
      - name: Static, contract and four-plan QA
        run: bash 18-marketplace/tests/qa-static.sh
      - name: Deterministic release build
        shell: bash
        run: |
          set -euo pipefail
          bash 18-marketplace/tools/build-release.sh "$RUNNER_TEMP/release-a"
          bash 18-marketplace/tools/build-release.sh "$RUNNER_TEMP/release-b"
          A="$RUNNER_TEMP/release-a/18-marketplace-2.1.0-RC3.zip"
          B="$RUNNER_TEMP/release-b/18-marketplace-2.1.0-RC3.zip"
          cmp "$A" "$B"
          unzip -t "$A"
          HASH_A="$(sha256sum "$A" | awk '{print $1}')"
          HASH_B="$(sha256sum "$B" | awk '{print $1}')"
          test "$HASH_A" = "$HASH_B"
          printf '%s  %s\n' "$HASH_A" "18-marketplace-2.1.0-RC3.zip" > "$RUNNER_TEMP/release-a/18-marketplace-2.1.0-RC3.zip.sha256"
          {
            echo '### File 18 Marketplace 2.1.0 RC3'
            echo
            echo "SHA-256: \`$HASH_A\`"
            echo
            echo "PHP matrix member: ${{ matrix.php }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: file18-marketplace-2.1.0-rc3
          path: |
            ${{ runner.temp }}/release-a/18-marketplace-2.1.0-RC3.zip
            ${{ runner.temp }}/release-a/18-marketplace-2.1.0-RC3.zip.sha256
          if-no-files-found: error
          retention-days: 14
