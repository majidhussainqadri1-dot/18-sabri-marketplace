name: File 18 Marketplace Quality
on:
  pull_request:
  push:
    branches:
      - main
      - feat/file-18-marketplace-plan-complete-2.0.0
permissions:
  contents: read
jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct canonical source
        run: bash reconstruct-source.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and contract QA
        run: bash 18-marketplace/tests/qa-static.sh
      - name: Deterministic release build
        run: |
          bash 18-marketplace/tools/build-release.sh "$RUNNER_TEMP/release-a"
          bash 18-marketplace/tools/build-release.sh "$RUNNER_TEMP/release-b"
          cmp "$RUNNER_TEMP/release-a/18-marketplace-2.0.0-RC1.zip" "$RUNNER_TEMP/release-b/18-marketplace-2.0.0-RC1.zip"
          unzip -t "$RUNNER_TEMP/release-a/18-marketplace-2.0.0-RC1.zip"
          echo "b1776d6fd45248dc29d5fde814f41b06f41ac392338bc79f22931b4e9e0901c8  $RUNNER_TEMP/release-a/18-marketplace-2.0.0-RC1.zip" | sha256sum --check
