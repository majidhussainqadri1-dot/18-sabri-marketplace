name: File 18 Marketplace Quality
on:
  pull_request:
  push:
    branches:
      - main
      - feat/file-18-marketplace-plan-complete-2.0.0
permissions:
  contents: read
jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Direct-source supply-chain gate
        shell: bash
        run: |
          set -euo pipefail
          test -s 18-marketplace/marketplace.php
          test -d 18-marketplace/includes
          test -d 18-marketplace/tests
          test ! -e reconstruct-source.sh
          test ! -d bundles
          test ! -d patches
          if find . -type f -name '*.b64*' -print -quit | grep -q .; then
            echo 'Encoded source bundle detected; canonical source must be directly reviewable.' >&2
            exit 1
          fi
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find 18-marketplace -type f -name '*.php' -print0)
      - name: JavaScript syntax
        run: |
          node --check 18-marketplace/assets/js/marketplace.js
          node --check 18-marketplace/assets/js/marketplace-completion.js
      - name: CSS structural gate
        run: python3 -c "import pathlib; s=pathlib.Path('18-marketplace/assets/css/marketplace.css').read_text(); assert s.count('{')==s.count('}')"
      - name: State-machine tests
        run: php 18-marketplace/tests/test-state-machines.php
      - name: Contract tests
        run: php 18-marketplace/tests/test-contracts.php
      - name: Source-architecture tests
        run: php 18-marketplace/tests/test-source-architecture.php
      - name: Adversarial invariant tests
        run: php 18-marketplace/tests/test-review-invariants.php
      - name: Four-plan invariant diagnostic
        id: fourplan
        shell: bash
        run: |
          set +e
          php 18-marketplace/tests/test-four-plan-invariants.php > "$RUNNER_TEMP/four-plan-${{ matrix.php }}.log" 2>&1
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/four-plan-${{ matrix.php }}.exit"
          cat "$RUNNER_TEMP/four-plan-${{ matrix.php }}.log"
          exit 0
      - name: Upload four-plan diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: file18-four-plan-diagnostic-php-${{ matrix.php }}
          path: |
            ${{ runner.temp }}/four-plan-${{ matrix.php }}.log
            ${{ runner.temp }}/four-plan-${{ matrix.php }}.exit
          if-no-files-found: error
          retention-days: 2
      - name: Enforce four-plan invariant result
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/four-plan-${{ matrix.php }}.exit")" = '0'
      - name: October forty-scope corrective regressions
        run: php 18-marketplace/tests/test-october-40-scope-regressions.php
      - name: File 19 notification contract
        run: php 18-marketplace/tests/test-file19-notification-contract.php
      - name: Safety report atomicity fault injection
        run: php 18-marketplace/tests/test-report-atomicity.php
      - name: Audit lock lifetime and nested transaction regression
        run: php 18-marketplace/tests/test-audit-transaction-lock.php
      - name: File 19 required notification fault injection
        run: php 18-marketplace/tests/test-outbox-required-notification-ack.php
      - name: Marketplace money and quantity numeric integrity
        run: php 18-marketplace/tests/test-money-stock-validation.php
      - name: File 17 native REST-owner and authorization bridge
        run: php 18-marketplace/tests/test-file17-native-context-bridge.php
      - name: Idempotency receipt fault-injection regression
        run: php 18-marketplace/tests/test-idempotency-durable-receipt.php
      - name: Inbox stale worker and dedupe fault injection
        run: php 18-marketplace/tests/test-inbox-crash-recovery.php
      - name: File10 media transaction and postcommit release
        run: php 18-marketplace/tests/test-media-atomicity.php
      - name: Recall and legal hold atomicity fault injection
        run: php 18-marketplace/tests/test-governance-recall-hold-atomicity.php
      - name: Seller identity snapshot DB fail-closed regression
        run: php 18-marketplace/tests/test-seller-atomicity.php
      - name: Forty independent source plan/companion scope anchors
        run: php 18-marketplace/tests/test-seventh-40-plan-anchors.php
      - name: Privacy retention-hold fail-closed regression
        run: php 18-marketplace/tests/test-privacy-hold-failclosed.php
      - name: Governance schema version promotion truth
        run: php 18-marketplace/tests/test-governance-schema-truth.php
      - name: Main Marketplace schema real-table drift negative tests
        run: php 18-marketplace/tests/test-core-schema-truth.php
      - name: File 17 legacy-only conversation/message migration negative tests
        run: php 18-marketplace/tests/test-file17-legacy-only-migration.php
      - name: Conditional CF05 analytics ownership does not duplicate File18 truth
        run: php 18-marketplace/tests/test-cf05-conditional-boundary.php
      - name: Privacy export required SQL source and evidence completeness
        run: php 18-marketplace/tests/test-privacy-export-completeness.php
      - name: File00 explicit verified/approved denial precedence
        run: php 18-marketplace/tests/test-file00-explicit-identity-denial.php
      - name: Source search and media safety fail-closed SQL regressions
        run: php 18-marketplace/tests/test-search-media-sql-failure.php
      - name: Conditional CF06 localization source owner boundary
        run: php 18-marketplace/tests/test-cf06-conditional-boundary.php
      - name: File00 canonical SMC_Contracts scoped marketplace integration regression
        run: php 18-marketplace/tests/test-file00-native-marketplace-contract.php
      - name: Fail-closed retention and immutable audit hash chain
        run: php 18-marketplace/tests/test-retention-chain-hold-failclosed.php
      - name: CF05 daily derivative metrics source and projection consistency
        run: php 18-marketplace/tests/test-derived-metrics-failclosed.php
      - name: Owner seller suspension and active listing pause transaction
        run: php 18-marketplace/tests/test-maintenance-seller-pause-rollback.php
      - name: Public expiry and commerce atomicity source-and-runtime negative cases
        run: php 18-marketplace/tests/test-expiry-commerce-integrity.php
      - name: Dashboard and Seller Studio SQL fail-closed actual-class regression
        run: php 18-marketplace/tests/test-dashboard-studio-sql-failclosed.php
      - name: Fail-closed recall owner / public exposure source regression
        run: php 18-marketplace/tests/test-rc17-recall-safety-failclosed.php
      - name: Fail-closed prohibited policy and source seeding regression
        run: php 18-marketplace/tests/test-rc17-policy-failclosed.php
      - name: RC18 owner PHP and admin publication negative regression
        run: php 18-marketplace/tests/test-rc18-core-publication-gates.php
      - name: RC18 independent language-facets migration truth
        run: php 18-marketplace/tests/test-rc18-facet-schema-truth.php
      - name: RC19 policy seeding transactional rollback and approved higher version
        run: php 18-marketplace/tests/test-rc19-policy-seeding-rollback.php
      - name: RC19 immutable medicine and zero-commission policy floor
        run: php 18-marketplace/tests/test-rc19-immutable-policy-floor.php
      - name: RC20 locked recall safety on offer, counter and deal commitments
        run: php 18-marketplace/tests/test-rc20-transactional-recall-commitments.php
      - name: RC20 schema migration and zero fee readiness truth
        run: php 18-marketplace/tests/test-rc20-readiness-schema-truth.php
      - name: RC21 File00 deal-dispute cancellation and audited rollback
        run: php 18-marketplace/tests/test-rc21-deal-auth-audit-atomicity.php
      - name: RC21 direct listing/report/dispute owner audit atomicity
        run: php 18-marketplace/tests/test-rc21-direct-owner-atomicity.php
      - name: RC22 durable callback uncertainty prevents unsafe retry
        run: php 18-marketplace/tests/test-rc22-idempotency-exception-uncertainty.php
      - name: RC22 exact-payload offer and counter-offer replay protection
        run: php 18-marketplace/tests/test-rc22-offer-payload-idempotency.php
      - name: RC23 current-actor identity and private Listing IDOR regression
        run: php 18-marketplace/tests/test-rc23-current-actor-ownership.php
      - name: RC24 native regulated evidence self-review and safety rollback tests
        run: php 18-marketplace/tests/test-rc24-native-evidence-review-safety.php
      - name: RC25 evidence save owner and concurrency guards
        run: php 18-marketplace/tests/test-rc25-evidence-save-locking.php
      - name: RC25 recall owner final-readback rollback regression
        run: php 18-marketplace/tests/test-rc25-recall-readback-atomicity.php
      - name: Full static aggregate gate
        run: bash 18-marketplace/tests/qa-static.sh
      - name: Forty counted full static and regression passes
        if: startsWith(github.head_ref, 'fix/file18-')
        shell: bash
        run: |
          set -euo pipefail
          for round in $(seq 1 40); do
            if ! bash 18-marketplace/tests/qa-static.sh > "$RUNNER_TEMP/file18-review-${round}.log" 2>&1; then
              echo "FILE18_REVIEW_ROUND=${round} RESULT=FAIL"
              cat "$RUNNER_TEMP/file18-review-${round}.log"
              exit 1
            fi
            printf 'FILE18_REVIEW_ROUND=%02d RESULT=PASS PHP=%s HEAD=%s\n' "$round" "${{ matrix.php }}" "${{ github.event.pull_request.head.sha }}"
          done
          echo 'FILE18_REVIEW_TOTAL=40 FILE18_REVIEW_PASSED=40 FILE18_REVIEW_FAILED=0'
      - name: Deterministic release build
        shell: bash
        run: |
          set -euo pipefail
          bash 18-marketplace/tools/build-release.sh "$RUNNER_TEMP/release-a"
          bash 18-marketplace/tools/build-release.sh "$RUNNER_TEMP/release-b"
          A="$RUNNER_TEMP/release-a/18-marketplace-2.1.0-RC25.zip"
          B="$RUNNER_TEMP/release-b/18-marketplace-2.1.0-RC25.zip"
          cmp "$A" "$B"
          unzip -t "$A"
          HASH_A="$(sha256sum "$A" | awk '{print $1}')"
          HASH_B="$(sha256sum "$B" | awk '{print $1}')"
          test "$HASH_A" = "$HASH_B"
          printf '%s  %s\n' "$HASH_A" "18-marketplace-2.1.0-RC25.zip" > "$RUNNER_TEMP/release-a/18-marketplace-2.1.0-RC25.zip.sha256"
          {
            echo '### File 18 Marketplace 2.1.0 RC25'
            echo
            echo "SHA-256: \`$HASH_A\`"
            echo
            echo "PHP matrix member: ${{ matrix.php }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: file18-marketplace-2.1.0-rc25
          path: |
            ${{ runner.temp }}/release-a/18-marketplace-2.1.0-RC25.zip
            ${{ runner.temp }}/release-a/18-marketplace-2.1.0-RC25.zip.sha256
          if-no-files-found: error
          retention-days: 14
