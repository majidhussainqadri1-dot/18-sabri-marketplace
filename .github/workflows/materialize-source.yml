name: Materialize File 18 Canonical Source
on:
  push:
    branches:
      - feat/file-18-marketplace-plan-complete-2.0.0
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/file-18-marketplace-plan-complete-2.0.0
          fetch-depth: 0
      - name: Reconstruct audited canonical source
        run: bash reconstruct-source.sh
      - name: Commit reviewable source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 18-marketplace
          if git diff --cached --quiet; then
            echo 'Canonical source tree is already materialized.'
            exit 0
          fi
          git commit -m 'Materialize canonical File 18 source tree for direct review'
          git push origin HEAD:feat/file-18-marketplace-plan-complete-2.0.0
