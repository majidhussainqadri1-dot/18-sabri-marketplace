name: File 18 Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-qa:
    strategy:
      matrix:
        php: ['8.1', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static QA
        run: bash tests/qa-static.sh
      - name: Verify package can be archived
        run: |
          cd ..
          zip -qr sabri-marketplace-1.2.0.zip sabri-marketplace -x 'sabri-marketplace/.git/*'
          unzip -t sabri-marketplace-1.2.0.zip
